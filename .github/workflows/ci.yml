# CI for G2-05 (PRD §I). Everything runs against local services inside the runner:
# Postgres as a service container and a local Supabase stack (auth + Mailpit) for browser E2E.
# No secrets are needed or used; nothing is deployed and nothing is posted.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  python:
    name: Python lint + unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clipflow
          POSTGRES_PASSWORD: clipflow_dev  # throwaway CI database, same as docker-compose.yml
          POSTGRES_DB: clipflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipflow -d clipflow" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: "services/*/pyproject.toml"
      - name: Install FFmpeg (media unit tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install
        run: python -m pip install -e services/worker -e "services/api[test]" pytest ruff
      - name: Lint (ruff)
        run: python -m ruff check agent services tools tests tasks.py
      - name: Unit tests
        run: python tasks.py test-unit
      - name: Integration tests (Postgres)
        run: python tasks.py test-integration -rs
      - name: Migrations apply, match models, and roll back
        env:
          DATABASE_URL: postgresql+psycopg://clipflow:clipflow_dev@127.0.0.1:5432/clipflow
        run: |
          python tasks.py migrate
          python -m alembic -c services/api/alembic.ini check
          python tasks.py migrate downgrade base
          python tasks.py migrate
      - name: Gate records are valid
        run: |
          for n in 0 1 2 3 4 5 6 7 8; do
            code=0; python tasks.py check-gate $n > /dev/null || code=$?
            if [ $code -eq 2 ]; then echo "docs/gates/G$n.md is invalid"; exit 1; fi
          done

  web:
    name: Web lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - name: Build (public placeholder values; real ones come from the deploy environment)
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          VITE_API_URL: https://api.example.invalid
        run: npm run build

  e2e:
    name: Browser E2E (local Supabase)
    runs-on: ubuntu-latest
    needs: [python, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clipflow
          POSTGRES_PASSWORD: clipflow_dev
          POSTGRES_DB: clipflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipflow -d clipflow" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: "services/*/pyproject.toml"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install FFmpeg (server-side clip checks and the E2E sample clip)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install
        run: |
          python -m pip install -e "services/api[test]"
          cd apps/web && npm ci && npx playwright install --with-deps chromium
      - name: Start local Supabase (ES256 key generated for this run only)
        run: |
          echo '[]' > supabase/signing_keys.json
          npx --yes supabase gen signing-key --algorithm ES256 --append
          npx --yes supabase start -x studio,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: E2E
        run: python tasks.py test-e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: var/evidence/e2e/
          retention-days: 7

  image:
    # G2-05 / E-49: the staging image builds, migrates into its own schema on start, serves the web
    # app and the API on one origin, and keeps `public` empty. Render deploys master only after this
    # and the other jobs pass (render.yaml: autoDeployTrigger checksPass). Nothing is pushed or deployed here.
    name: Staging image build + smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clipflow
          POSTGRES_PASSWORD: clipflow_dev  # throwaway CI database
          POSTGRES_DB: clipflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipflow -d clipflow" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >
          docker build -t punpun-staging:ci --build-arg BUILD_ID=${GITHUB_SHA::7}
          --build-arg VITE_SUPABASE_URL=https://example.supabase.co
          --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci-placeholder .
      - name: Start and smoke test
        run: |
          docker run -d --name staging --network host -e PORT=8080 -e DB_SCHEMA=clipflow \
            -e DATABASE_URL=postgresql://clipflow:clipflow_dev@127.0.0.1:5432/clipflow \
            -e SUPABASE_URL=https://example.supabase.co punpun-staging:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q "\"build\":\"${GITHUB_SHA::7}\""
          curl -fsS http://127.0.0.1:8080/jobs/any | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/v1/billing/plans > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/nope)" = 404
          test "$(docker exec staging python -c "import os,sqlalchemy as s;e=s.create_engine(os.environ['DATABASE_URL'].replace('postgresql://','postgresql+psycopg://'));print(len(s.inspect(e).get_table_names(schema='public')))")" = 0
      - name: Logs on failure
        if: failure()
        run: docker logs staging || true
