[project]
name = "clipflow-repo-tools"
version = "0.0.0"
description = "Repository tooling for ClipFlow (services get their own projects from P1/P2)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Lint for all Python code in the repo (CI: `py tasks.py lint`).
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps", "var", "supabase"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once on purpose.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "clipflow_api", "clipflow_worker", "tools"]
